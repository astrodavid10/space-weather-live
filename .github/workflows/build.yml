name: Build

# The repo's CI tripwire, for BOTH tracks (see CLAUDE.md "Two tracks, one
# contract"). It used to trigger on `pull_request` only, and its `branches:`
# was a scalar rather than a list -- so `gh run list --workflow build.yml` was
# empty, ever: nothing in this project's normal flow opens a PR against main.
# Pushes now run it too, which is where the work actually lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Narrower than read-all: these jobs only ever read the checkout. They run on
# fork PRs (pull_request, NOT pull_request_target) with persist-credentials
# false, so no secret is reachable from PR-supplied code.
permissions:
  contents: read

jobs:
  # ── the Vue app ────────────────────────────────────────────────────────────
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The PR head on a pull_request; the pushed commit on a push.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.12.0

      # --immutable: a yarn.lock that does not match package.json is a failure,
      # not something to silently repair on a runner.
      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # `tsc --noEmit` does NOT check .vue script blocks -- only `yarn build`
      # does -- so this is a cheap first pass, not a substitute for the build.
      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build


  # ── the Python pipeline ────────────────────────────────────────────────────
  # Parallel with `app`: the two tracks share only a data contract, so neither
  # needs the other's result to be worth having.
  pipeline:
    runs-on: ubuntu-latest
    # The install of the pinned scientific stack is the slow part (~3-5 min);
    # 20 is generous for it and still bounds a hung download.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline requirements
        run: pip install -r pipeline/requirements.txt pytest pyflakes

      # Our code is strict; the vendored dome engine is advisory (not ours to lint).
      - name: Pyflakes (pipeline)
        run: python -m pyflakes pipeline/*.py pipeline/tests scripts/*.py

      - name: Pyflakes (engine, advisory)
        if: ${{ hashFiles('pipeline/engine/magneto/render.py') != '' }}
        continue-on-error: true
        run: python -m pyflakes pipeline/engine/magneto pipeline/engine/webexport pipeline/engine/tools

      - name: Pipeline tests
        run: python -m pytest pipeline/tests -q

      # Proves geopack imports offline on Linux/py3.12 with the vendored IGRF,
      # and runs the engine's own exporter tests (render-tree tests self-skip).
      - name: Engine tests
        if: ${{ hashFiles('pipeline/engine/magneto/render.py') != '' }}
        working-directory: pipeline/engine
        run: |
          python vendor/install_igrf.py
          python -m pytest tests -q
